version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: turfhub-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: turfhub

  backend:
    build: .
    container_name: turfhub-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/turfhub
    depends_on:
      - mongodb

volumes:
  mongo-data:
